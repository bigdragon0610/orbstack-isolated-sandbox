#cloud-config
# =============================================================================
# OrbStack 隔離マシン用 cloud-init 設定 (cloud-config 形式)
#
# 用途: npm / pip などの untrusted な依存関係や postinstall スクリプトを
#       Mac から隔離された Linux 環境で安全に実行するための開発環境を構築する。
#
# 使い方:
#   orb create --isolated ubuntu sandbox -c cloud-init/user-data.yml
#
# 構成:
#   - システム全体ツール … cloud-init の boot 時 (root) に導入
#       apt: 基本ツール / Skill 用ツール（下記 packages 参照）
#       gh (公式 apt リポジトリ), mo (GitHub Release .deb, SHA256 検証),
#       draw.io Desktop (AppImage を /opt/drawio に展開, SHA256 検証),
#       AWS CLI v2 (公式zip), Docker Engine + Compose/Buildx (公式 apt リポジトリ),
#       git-secrets
#   - ユーザー固有ツール … 初回ログイン時にログインユーザー自身で導入
#       mise（ランタイム/CLI のバージョン管理。宣言は /etc/mise/config.toml）
#         -> node, uv, codex, playwright-cli
#       playwright 用 Chromium, Claude Code (公式installer), Kiro CLI (zip)
#
#   ※ OrbStack は cloud-init の後に「macOSユーザー名のユーザー」を作成するため、
#      runcmd(=boot時/root) では対象ユーザーがまだ存在しない。そこでユーザー固有
#      ツールは /etc/profile.d 経由の「初回ログイン時プロビジョニング」で導入する。
#
# 注意: このファイルは平文で保存される。トークンや秘密鍵など機密情報は
#       書き込まないこと（README の「機密情報の扱い」参照）。
# =============================================================================

package_update: true
package_upgrade: true

packages:
  # --- 基本ツール ---
  - git
  - curl
  - wget
  - ca-certificates
  - build-essential
  - unzip
  - jq
  - file
  - ncurses-bin
  - python3
  # --- Codex CLI の Linux サンドボックス ---
  - bubblewrap
  # --- procedure-doc: Markdown -> docx ---
  - pandoc
  # --- line-stamp-production: 画像加工と日本語フォント ---
  - imagemagick
  - fonts-noto-cjk
  # --- orbstack-playwright-vnc: 仮想ディスプレイと VNC ---
  - xvfb
  - x11vnc
  - xdotool
  - x11-utils
  - openssl
  # --- drawio: draw.io Desktop (Electron) の実行ライブラリ ---
  - libgtk-3-0t64
  - libnss3
  - libasound2t64
  - libgbm1
  - libxss1
  - libxtst6

write_files:
  # --- mise で管理するツールの宣言（全ユーザー共通の system config）----------
  # 追加・更新はここを編集する。個人用の追加は ~/.config/mise/config.toml へ。
  - path: /etc/mise/config.toml
    permissions: '0644'
    content: |
      [tools]
      node = "lts"
      uv = "latest"
      "npm:@openai/codex" = "latest"
      # orbstack-playwright-vnc / procedure-doc Skill が前提とするバージョン
      "npm:@playwright/cli" = "0.1.15"

  # --- 初回ログイン時にユーザー固有ツールを導入する本体 --------------------
  - path: /usr/local/sbin/user-setup.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # ログインユーザー自身として実行され、開発ツールを ~/ 配下に導入する。
      set -euo pipefail
      MARKER="$HOME/.sandbox-provisioned"
      LOG="$HOME/.sandbox-setup.log"
      exec > >(tee -a "$LOG") 2>&1
      echo "[sandbox] $(date -Is) provisioning user tools for $(whoami)"

      # npm の postinstall を既定で無効化（信頼するパッケージだけ個別に許可する）。
      # mise の npm バックエンドもこの設定で動くため、ツール導入より先に置く。
      printf 'ignore-scripts=true\nfund=false\n' > "$HOME/.npmrc"

      # mise（公式インストーラ -> ~/.local/bin/mise）
      export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
      if ! command -v mise >/dev/null 2>&1; then
        curl -fsSL https://mise.run | sh
      fi
      # /etc/mise/config.toml に宣言したツールを導入
      mise install --yes

      # 対話シェルは mise activate、非対話（bash -lc やエージェント）は shims で PATH を通す
      if ! grep -q 'mise activate' "$HOME/.bashrc" 2>/dev/null; then
        echo 'eval "$($HOME/.local/bin/mise activate bash)"' >> "$HOME/.bashrc"
      fi
      if ! grep -q 'mise/shims' "$HOME/.profile" 2>/dev/null; then
        echo 'export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"' >> "$HOME/.profile"
      fi

      # playwright-cli 用の Chromium（Linux ARM64 では Google Chrome が無いため）
      mise exec -- playwright-cli install-browser chromium || \
        echo "[sandbox] chromium install failed (skipped)"

      # Claude Code（公式ネイティブインストーラ -> ~/.local/bin）
      curl -fsSL https://claude.ai/install.sh | bash

      # Kiro CLI（zip インストーラ -> ~/.local/bin。.deb は amd64 専用のため zip を使う）
      case "$(uname -m)" in
        aarch64|arm64) KARCH=aarch64 ;;
        x86_64|amd64)  KARCH=x86_64 ;;
        *)             KARCH="$(uname -m)" ;;
      esac
      # glibc >= 2.34 は標準版、未満は musl 版
      KSUFFIX=""
      GLIBC="$(ldd --version 2>/dev/null | head -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)"
      if [ -n "$GLIBC" ] && [ "$(printf '%s\n2.34\n' "$GLIBC" | sort -V | head -1)" != "2.34" ]; then
        KSUFFIX="-musl"
      fi
      ktmp="$(mktemp -d)"
      curl --proto '=https' --tlsv1.2 -sSf \
        "https://desktop-release.q.us-east-1.amazonaws.com/latest/kirocli-${KARCH}-linux${KSUFFIX}.zip" \
        -o "$ktmp/kirocli.zip"
      unzip -q "$ktmp/kirocli.zip" -d "$ktmp"
      "$ktmp/kirocli/install.sh" --no-confirm
      rm -rf "$ktmp"

      # 今後のシェルで ~/.local/bin を PATH に通す
      if ! grep -q '.local/bin' "$HOME/.bashrc" 2>/dev/null; then
        echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$HOME/.bashrc"
      fi

      # docker グループへ追加（sudo なしで docker を使う）。boot 時点ではこのユーザーが
      # 存在しないため cloud-init 側では行えず、初回ログイン時にここで行う。
      # ※ 反映されるのは次回ログインから。今のシェルでは sudo docker を使う。
      if getent group docker >/dev/null 2>&1; then
        sudo -n usermod -aG docker "$(whoami)" || echo "[sandbox] failed to add $(whoami) to docker group"
      fi

      # git-secrets をグローバルに有効化（今後 clone/init するリポジトリすべてで pre-commit チェック）
      if command -v git-secrets >/dev/null 2>&1; then
        git secrets --register-aws --global
        git secrets --add 'private_key' --global || true       # GCP
        git secrets --add 'private_key_id' --global || true    # GCP
        git secrets --install -f "$HOME/.git-templates/git-secrets"
        git config --global init.templateDir "$HOME/.git-templates/git-secrets"
      fi

      # --- エージェントの自動実行設定 ---------------------------------------
      # このマシン自体が隔離境界なので、エージェント側の承認・制限は外して自動で動かす。
      # Kiro CLI: 全ツール自動承認のエージェントを既定にする
      mkdir -p "$HOME/.kiro/agents" "$HOME/.kiro/skills"
      cat > "$HOME/.kiro/agents/allAllowedTools.json" <<'JSONEOF'
      {
        "name": "allAllowedTools",
        "description": "All tools auto-approved",
        "tools": ["*"],
        "allowedTools": ["*"],
        "toolAliases": {},
        "hooks": {},
        "mcpServers": {},
        "includeMcpJson": true,
        "resources": ["file://.kiro/steering/**/*.md", "skill://~/.kiro/skills/**/SKILL.md"]
      }
      JSONEOF
      "$HOME/.local/bin/kiro-cli" settings chat.defaultAgent allAllowedTools || \
        echo "[sandbox] failed to set kiro default agent"

      # Codex: 承認なし・Codex 独自のサンドボックス制限なし
      mkdir -p "$HOME/.codex" "$HOME/.codex/skills"
      touch "$HOME/.codex/config.toml"
      if ! grep -q '^approval_policy' "$HOME/.codex/config.toml"; then
        # トップレベルのキーはテーブルより前に置く必要があるため先頭へ挿入する
        printf 'approval_policy = "never"\nsandbox_mode = "danger-full-access"\n%s' \
          "$(cat "$HOME/.codex/config.toml")" > "$HOME/.codex/config.toml"
      fi

      # Claude Code: link.sh が配布先として認識するよう skills ディレクトリだけ作る
      mkdir -p "$HOME/.claude/skills"

      touch "$MARKER"
      echo "[sandbox] done. open a new shell or run 'source ~/.bashrc' to use the tools."

  # --- 初回ログイン時に上記を 1 回だけ走らせるフック ----------------------
  - path: /etc/profile.d/zz-sandbox-setup.sh
    permissions: '0644'
    content: |
      # 初回ログイン時にユーザー固有ツールを導入する（root と導入済みユーザーは除外）
      if [ "$(id -u)" != "0" ] && [ -n "$HOME" ] \
         && [ ! -f "$HOME/.sandbox-provisioned" ] \
         && [ -x /usr/local/sbin/user-setup.sh ]; then
        /usr/local/sbin/user-setup.sh || echo "[sandbox] user-setup failed; see ~/.sandbox-setup.log"
      fi

  # --- Mac から漏れてきた無効な X11 DISPLAY を掃除 ----------------------------
  - path: /etc/profile.d/zz-clean-display.sh
    permissions: '0644'
    content: |
      # 転送された XQuartz の DISPLAY は VM 内で無効。残ると X11 を使うツールが
      # 到達できない表示へ接続しようとして失敗するため外す（Xvfb を使う側は明示的に DISPLAY を設定する）
      case "${DISPLAY:-}" in
        */org.xquartz:*|/private/tmp/*|/tmp/com.apple.*) unset DISPLAY ;;
      esac

  # --- サンドボックス識別: 端末背景を紺(PowerShell 風)に染めて隔離環境だと一目で分かるようにする ---
  - path: /etc/profile.d/zz-sandbox-color.sh
    permissions: '0644'
    content: |
      # 共有 dotfiles は変更せず、ログイン時に OSC 11 で端末の既定背景色を変更する（Ghostty 等が対応）。
      # サンドボックスを抜けたときにホスト側シェルが染まったままにならないよう EXIT で既定へ戻す（OSC 111）。
      case "$-" in
        *i*)
          if [ -t 1 ]; then
            printf '\033]11;#0f2540\a'
            trap 'printf "\033]111\a"' EXIT
          fi
          ;;
      esac

  # --- draw.io Desktop のヘッドレス実行ラッパー --------------------------------
  # --- Skill の復旧（gh auth login 後に 1 回実行する）-------------------------
  # agent-skills は Private リポジトリで認証が要るため、プロビジョニングでは自動実行しない。
  - path: /usr/local/bin/sandbox-restore-skills
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      DEST="$HOME/ryudai/agent-skills"
      if ! gh auth status >/dev/null 2>&1; then
        echo "先に gh auth login を実行してください" >&2; exit 1
      fi
      gh auth setup-git
      if [ -d "$DEST/.git" ]; then
        git -C "$DEST" pull --ff-only
        git -C "$DEST" submodule update --init --recursive
      else
        mkdir -p "$(dirname "$DEST")"
        git clone --recurse-submodules https://github.com/bigdragon0610/agent-skills.git "$DEST"
      fi
      mkdir -p "$HOME/.kiro/skills" "$HOME/.claude/skills" "$HOME/.codex/skills"
      "$DEST/scripts/link.sh"

  - path: /usr/local/bin/drawio
    permissions: '0755'
    content: |
      #!/bin/sh
      # draw.io Desktop (extracted AppImage) — headless wrapper for this sandbox.
      # Runs under Xvfb and disables the Chromium sandbox so the CLI works without a display.
      exec xvfb-run -a /opt/drawio/drawio --no-sandbox "$@"

  # --- boot 時 (root) に走らせるシステム全体プロビジョニング --------------
  - path: /usr/local/sbin/system-setup.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euxo pipefail
      export DEBIAN_FRONTEND=noninteractive
      DEB_ARCH="$(dpkg --print-architecture)"   # arm64 / amd64
      case "$(uname -m)" in
        aarch64|arm64) UNAME_ARCH=aarch64 ;;
        x86_64|amd64)  UNAME_ARCH=x86_64 ;;
        *)             UNAME_ARCH="$(uname -m)" ;;
      esac

      # GitHub の最新リリースタグを返す（API のレート制限を避けて /releases/latest のリダイレクトを使う）
      latest_tag() {
        curl -fsSLI -o /dev/null -w '%{url_effective}' "https://github.com/$1/releases/latest" | sed 's#.*/tag/##'
      }

      # AWS CLI v2（-> /usr/local/bin/aws）
      awstmp="$(mktemp -d)"
      curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-${UNAME_ARCH}.zip" -o "$awstmp/awscliv2.zip"
      unzip -q "$awstmp/awscliv2.zip" -d "$awstmp"
      "$awstmp/aws/install" --update
      rm -rf "$awstmp"

      # apt リポジトリ用の鍵置き場
      install -m 0755 -d /etc/apt/keyrings
      . /etc/os-release

      # Docker Engine（公式 apt リポジトリ。Compose / Buildx はプラグインとして同梱）
      # ※ Mac の Docker Desktop / OrbStack の Docker とは別物で、この隔離マシン内で完結する。
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      echo "deb [arch=${DEB_ARCH} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" \
        > /etc/apt/sources.list.d/docker.list

      # GitHub CLI（公式 apt リポジトリ）
      curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
      chmod a+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
      echo "deb [arch=${DEB_ARCH} signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
        > /etc/apt/sources.list.d/github-cli.list

      apt-get update -qq
      apt-get install -y -qq docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin gh
      systemctl enable --now docker

      # mo（Markdown ビューア。k1LoW/mo の最新 .deb を checksums.txt で検証して導入）
      motmp="$(mktemp -d)"
      MO_TAG="$(latest_tag k1LoW/mo)"
      MO_DEB="mo_${MO_TAG#v}-1_${DEB_ARCH}.deb"
      curl -fsSL "https://github.com/k1LoW/mo/releases/download/${MO_TAG}/${MO_DEB}" -o "$motmp/${MO_DEB}"
      curl -fsSL "https://github.com/k1LoW/mo/releases/download/${MO_TAG}/checksums.txt" -o "$motmp/checksums.txt"
      (cd "$motmp" && grep " ${MO_DEB}\$" checksums.txt | sha256sum -c -)
      apt-get install -y -qq "$motmp/${MO_DEB}"
      rm -rf "$motmp"

      # draw.io Desktop（AppImage を展開して /opt/drawio へ。FUSE 不要で動かすため展開する）
      case "$DEB_ARCH" in arm64) DRAWIO_ARCH=arm64 ;; *) DRAWIO_ARCH=x86_64 ;; esac
      dtmp="$(mktemp -d)"
      DRAWIO_TAG="$(latest_tag jgraph/drawio-desktop)"
      DRAWIO_IMG="drawio-${DRAWIO_ARCH}-${DRAWIO_TAG#v}.AppImage"
      curl -fsSL "https://github.com/jgraph/drawio-desktop/releases/download/${DRAWIO_TAG}/${DRAWIO_IMG}" -o "$dtmp/${DRAWIO_IMG}"
      curl -fsSL "https://github.com/jgraph/drawio-desktop/releases/download/${DRAWIO_TAG}/Files-SHA256-Hashes.txt" -o "$dtmp/hashes.txt"
      (cd "$dtmp" && grep " ${DRAWIO_IMG}\$" hashes.txt | sha256sum -c -)
      chmod +x "$dtmp/${DRAWIO_IMG}"
      (cd "$dtmp" && "./${DRAWIO_IMG}" --appimage-extract >/dev/null)
      rm -rf /opt/drawio
      mv "$dtmp/squashfs-root" /opt/drawio
      chmod -R a+rX /opt/drawio
      rm -rf "$dtmp"

      # git-secrets（AWS謹製。コミット前に認証情報の混入を検知する。make install で /usr/local/bin へ）
      gtmp="$(mktemp -d)"
      git clone --depth 1 https://github.com/awslabs/git-secrets.git "$gtmp/git-secrets"
      make -C "$gtmp/git-secrets" install
      rm -rf "$gtmp"

      apt-get clean
      touch /etc/cloud-init-done

runcmd:
  - /usr/local/sbin/system-setup.sh

final_message: "OrbStack isolated sandbox is ready after $UPTIME seconds. Per-user tools install on first login."
